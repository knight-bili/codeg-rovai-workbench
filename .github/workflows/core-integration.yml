name: Core integration

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate (all at milestone acceptance)
        type: choice
        default: linux
        options: [linux, windows, all]

permissions:
  contents: read

concurrency:
  group: core-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-latest","windows-latest"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["ubuntu-latest"]') }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Check format and all target types
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets
      - name: Run default workspace tests
        run: cargo test --workspace -- --test-threads=4
      - name: Verify Runtime catalog and atomic migration regressions
        run: |
          cargo test -p rovai-core --features extended-tests --lib native_mode_catalogs_preserve_choices_and_platform_qualification
          cargo test -p rovai-core --features extended-tests --lib db:: -- --test-threads=4
          cargo test -p rovai-core --features extended-tests --lib canvas_ -- --test-threads=4
          cargo test -p rovai-core --features extended-tests --lib acp::route_policy_tests::
          cargo test -p rovai-core --features extended-tests --lib health::launch_policy_tests::
          cargo test -p rovai-core --features extended-tests --lib runtime_parsers_emit_sparse_usage_without_antigravity_inference
