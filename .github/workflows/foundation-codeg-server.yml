name: Codeg source baseline

on:
  push:
    branches: ['phase/i01-foundation']
    paths: ['.github/workflows/foundation-codeg-server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeg-source-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-server:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Extract locked public donor
        shell: pwsh
        run: |
          $sourceLock = Get-Content integration/sources.lock.json -Raw | ConvertFrom-Json
          $source = $sourceLock.sources | Where-Object id -eq 'codeg'
          if ($source.commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source SHA' }
          $archive = Join-Path $env:RUNNER_TEMP 'codeg-source.zip'
          Invoke-WebRequest -Uri "https://codeload.github.com/spacering-net/codeg/zip/$($source.commit)" -OutFile $archive
          $extract = Join-Path $env:RUNNER_TEMP 'codeg-source'
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $donor = Get-ChildItem -LiteralPath $extract -Directory | Select-Object -First 1
          "CODEG_DONOR=$($donor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
          package_json_file: ${{ env.CODEG_DONOR }}/package.json
          run_install: false
      - name: Build locked Codeg Web
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:CODEG_DONOR
          pnpm install --frozen-lockfile --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run postinstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          exit $LASTEXITCODE
      - name: Build native Server
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:CODEG_DONOR
          cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features server-bin --bin codeg-server
          exit $LASTEXITCODE
      - name: Verify isolated authenticated health
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'codeg-health-fixture'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $env:CODEG_DATA_DIR = $fixture
          $env:CODEG_HOME = $fixture
          $env:CODEG_STATIC_DIR = Join-Path $env:CODEG_DONOR 'out'
          $env:CODEG_HOST = '127.0.0.1'
          $env:CODEG_PORT = '39873'
          $env:CODEG_TOKEN = 'fixture-' + [Guid]::NewGuid().ToString('N')
          $binary = Join-Path $env:CODEG_DONOR 'src-tauri/target/debug/codeg-server.exe'
          $process = Start-Process -FilePath $binary -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $fixture 'stdout.log') -RedirectStandardError (Join-Path $fixture 'stderr.log')
          try {
            $response = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($process.HasExited) { throw 'Source Server exited during startup' }
              try { $response = Invoke-WebRequest -Uri 'http://127.0.0.1:39873/api/health' -Method Post -ContentType 'application/json' -Body '{}' -Headers @{Authorization="Bearer $env:CODEG_TOKEN"}; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $response -or $response.StatusCode -ne 200) { throw 'Health failed' }
            @{sourceServer='real_native_binary';authenticatedHealth='passed';runtime='not_started';dataRoot='isolated_fixture'} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:CODEG_DONOR 'baseline-health.json')
          } finally { if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force } }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeg-server-windows-baseline
          path: |
            ${{ env.CODEG_DONOR }}/src-tauri/target/debug/codeg-server.exe
            ${{ env.CODEG_DONOR }}/baseline-health.json
          if-no-files-found: error
          retention-days: 3
