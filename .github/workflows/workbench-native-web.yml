name: Workbench native Desktop and Web

on:
  workflow_dispatch:
    inputs:
      arch:
        description: macOS architecture (all at milestone acceptance)
        type: choice
        default: arm64
        options: [arm64, x64, all]

permissions:
  contents: read

concurrency:
  group: workbench-native-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-web:
    name: Desktop and Web macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'all' && '[{"arch":"arm64","runner":"macos-26"},{"arch":"x64","runner":"macos-26-intel"}]' || inputs.arch == 'x64' && '[{"arch":"x64","runner":"macos-26-intel"}]' || '[{"arch":"arm64","runner":"macos-26"}]') }}
    env:
      CARGO_BUILD_JOBS: 2
      NODE_OPTIONS: --max-old-space-size=3072
      ROVAI_REQUIRE_ELECTRON_INTEGRATION: '1'
      ROVAI_REVIEW_CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
          run_install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Check native browser prerequisite
        run: |
          echo "ROVAI_HOST_WEB_LIVE_OUTPUT=$RUNNER_TEMP/workbench-native-web" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/workbench-native-web"
          test -x "$ROVAI_REVIEW_CHROME"
          "$ROVAI_REVIEW_CHROME" --version
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify isolated pinned Gemini ACP without credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/gemini-runtime-0.60.0" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org @google/gemini-cli@0.60.0
          node tools/integration/smoke-gemini-acp.mjs "$RUNNER_TEMP/gemini-runtime-0.60.0/node_modules/@google/gemini-cli" "$ROVAI_HOST_WEB_LIVE_OUTPUT/gemini"
      - name: Compile Core and shared production pages
        run: |
          pnpm core:build:debug
          pnpm build:desktop
      - name: Run real native Desktop and two browser editors
        run: |
          pnpm test:host-web-live > "$ROVAI_HOST_WEB_LIVE_OUTPUT/native-test.log" 2>&1
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const p=process.env.ROVAI_HOST_WEB_LIVE_OUTPUT; const r=JSON.parse(fs.readFileSync(`${p}/desktop-web-live.json`,"utf8")); assert.equal(r.stage,"managed-desktop-web-passed"); assert.equal(r.sameComposerAfterReauth,true); assert.equal(r.coreAliveAfterWebStop,true); assert.equal(r.realRuntime,false);'
      - name: Preserve credential-free fixture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workbench-native-web-${{ matrix.arch }}
          path: |
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/native-test.log
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/desktop-startup-state.json
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/desktop-startup-failure.png
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/desktop-web-live.json
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/desktop-day.png
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/desktop-night.png
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/web-day.png
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/web-night.png
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/web-independent-input.png
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/web-after-reauth.png
            ${{ env.ROVAI_HOST_WEB_LIVE_OUTPUT }}/gemini/*/result.json
          if-no-files-found: warn
          retention-days: 1
